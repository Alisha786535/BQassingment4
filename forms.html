<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="./stylesheet/style.css">
</head>

<body>
    <div class="container">
        <h1>Application Of Certification</h1>
        <div class="contact-box">
            <div class="contact-left">
                <h2>Request:</h2>
                <form action="/action page.php">
                    <div class="input-row">
                        <div class="input-group">
                            <label for="fname">
                                <h4>Full Name:</h4>
                            </label>
                            <input type="text" placeholder="John Alley">
                        </div>
                        <div class="input-group">
                            <label for="contact">
                                <h4>Phone Number:</h4>
                            </label>
                            <input type="number" placeholder="0315-9838347">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="e-mail">
                                <h4>Email Address:</h4>
                            </label>
                            <input type="email" placeholder="johnalley341368@gmail.com">
                        </div>
                        <div class="input-group">
                            <label for="subject">
                                <h4>Course:</h4>
                            </label>
                            <input type="text" placeholder="Query">
                        </div>
                    </div>
                    <label for="Status">Status</label>
                    <br>
                    <input type="checkbox" id="passed">
                    <label for="passed">passed</label>
                    <br>
                    <input type="checkbox" id="failed">
                    <label for="failed">failed</label>
                    <button type="button">
                        <h4>Send Message</h4>
                    </button>
                    <a href="tables.html" target="_blank">
                        <h4>
                            <button type="button">See Your Results</button>
                        </h4>
                    </a>
                </form>
            </div>
        </div>
        <a href="index.html">
            Results
        </a>
        <a href="forms.html">
            Apply for certificates
        </a>
    </div>
</body>

</html>
